name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="mori.exe"
          else
            bin="mori"
          fi
          archive="mori-${TARGET}.tar.gz"
          stage="dist/stage"
          mkdir -p "$stage" dist
          cp "target/${TARGET}/release/${bin}" "${stage}/${bin}"
          tar -C "$stage" -czf "dist/${archive}" "$bin"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "${archive}.sha256"
            else
              shasum -a 256 "$archive" | awk '{printf "%s  %s\n", $1, $2}' > "${archive}.sha256"
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.sha256 | sort > checksums.txt
          rm -f ./*.sha256
          echo "checksums.txt:"
          cat checksums.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install with install.sh, which checks checksums.txt before copying the binary. See RELEASING.md. The binary includes SurrealDB under the Business Source License 1.1. See NOTICE."
