[package]
name = "mori-cli"
version = "0.1.0"
edition = "2021"
description = "mori — the git for cognition. Compile context with the Locus SDK and keep it in a per-repo SurrealKV file."
license = "Apache-2.0"
readme = "README.md"
publish = true

# The published crates.io name is mori-cli. Keep this library crate named mori
# so the binary can keep `use mori::`.
[lib]
name = "mori"
path = "src/lib.rs"

[[bin]]
name = "mori"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
locus-core-rs = { version = "0.5.1", features = ["surreal-runtime"] }
locus-sdk = { version = "0.5.0", default-features = false }
locus-surreal-adapter = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
