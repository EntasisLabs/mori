[package]
name = "mori"
version = "0.1.0"
edition = "2021"
description = "mori — the git for cognition. Remember documents, chats, and notes in a folder."
authors = ["Entasis Labs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/EntasisLabs/mori"
homepage = "https://github.com/EntasisLabs/mori"
readme = "README.md"
keywords = ["cli", "memory", "locus", "notes"]
categories = ["command-line-utilities"]
# Source is dual-licensed. Binary releases are built by the release workflow.
# crates.io publishing stays off until a maintainer turns it on. See RELEASING.md.
publish = false

[[bin]]
name = "mori"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
locus-core-rs = { version = "0.5.1", features = ["surreal-runtime"] }
locus-sdk = { version = "0.5.0", default-features = false }
locus-surreal-adapter = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
